name: Validar containers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar a imagem da plataforma em ghcr.io (produção na VPS; só com aprovação do responsável)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGEM_PLATAFORMA: ghcr.io/rdgaz/vetus-plataforma

jobs:
  # 1) Lint: roda antes de qualquer imagem Docker (o build só começa se passar)
  lint:
    name: Lint (front e API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plataforma/front/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Sintaxe dos scripts (receptor, web, testes, ferramentas)
        run: |
          for f in receptor/src/*.js web/src/*.js tests/*.js ferramentas/*.js; do node --check "$f"; done

      - name: Front - dependências
        run: npm ci --prefix plataforma/front

      - name: Front - lint (Biome; erros travam, avisos só aparecem)
        run: npm run lint --prefix plataforma/front

      - name: Front - TypeScript
        working-directory: plataforma/front
        run: npx tsc --noEmit

      - name: API - compila sem nenhum aviso
        run: dotnet build plataforma/api -warnaserror -nologo

      - name: API - analisadores do .NET
        run: dotnet format analyzers plataforma/api --verify-no-changes --severity error --no-restore

  # 2) Segurança do código: segredos no Git e bibliotecas com vulnerabilidade conhecida
  seguranca-codigo:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # todo o histórico: um segredo apagado depois continua no Git

      - name: Segredos no Git (Gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --no-banner -v

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Front - vulnerabilidades graves nas bibliotecas (npm audit)
        run: |
          cd plataforma/front
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: API - pacotes NuGet vulneráveis (grave ou crítico)
        run: |
          dotnet list plataforma/api package --vulnerable --include-transitive | tee nuget-vulneraveis.txt
          if grep -Eiq '(High|Critical)' nuget-vulneraveis.txt; then echo "Há pacote NuGet com vulnerabilidade grave ou crítica."; exit 1; fi

  # 3) Análise do código (CodeQL): C# da API e TypeScript do front
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.linguagem }}

  # 4) Sistema no ar: imagens, containers, testes de ponta a ponta, ataque automático (ZAP) e testes de segurança
  containers:
    name: Build e teste ponta a ponta
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ADMIN_USER: ci
      ADMIN_PASSWORD: ci-senha-teste
      DICOM_PORT: "2345"
      WEB_PORT: "8080"
      PLATAFORMA_PORT: "5080"
      POSTGRES_PASSWORD: ci-senha-banco
      VETUS_ADMIN_EMAIL: admin@ci.local
      VETUS_ADMIN_SENHA: ci-senha-admin
      VETUS_CHAVE_INTERNA: ci-chave-interna
      IA_SIMULADA: "true"   # pré-laudo de exemplo, sem chamar IA de verdade (sem custo)
      VETUS_SMTP_PERMITIR_REDE_INTERNA: "true"   # SMTP de teste (Mailpit) na rede do Docker
      MAILPIT_URL: http://127.0.0.1:8025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            receptor/package-lock.json
            web/package-lock.json

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Build das imagens
        run: docker compose build

      - name: Subir containers
        run: docker compose up -d

      - name: Aguardar containers saudáveis
        run: |
          for i in $(seq 1 90); do
            r=$(docker inspect -f '{{.State.Health.Status}}' vetus-receptor)
            w=$(docker inspect -f '{{.State.Health.Status}}' vetus-web)
            p=$(docker inspect -f '{{.State.Health.Status}}' vetus-plataforma)
            echo "receptor=$r web=$w plataforma=$p"
            [ "$r" = healthy ] && [ "$w" = healthy ] && [ "$p" = healthy ] && exit 0
            sleep 2
          done
          exit 1

      - name: Servidor de e-mail de teste (Mailpit) na rede dos containers
        run: |
          docker run -d --name vetus-mailpit --network "$(basename "$PWD" | tr '[:upper:]' '[:lower:]')_default" \
            --network-alias mailpit -p 8025:8025 \
            -e MP_SMTP_AUTH_ACCEPT_ANY=1 -e MP_SMTP_AUTH_ALLOW_INSECURE=1 axllent/mailpit
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8025/api/v1/messages >/dev/null && exit 0; sleep 1; done; exit 1

      - name: Dependências do teste
        run: npm ci --prefix receptor

      - name: Teste ponta a ponta (envio DICOM -> fotos -> área web)
        run: node tests/e2e.js

      - name: Teste da plataforma (login, clínicas, usuários, acesso)
        run: node tests/plataforma.js

      - name: Teste dos exames por clínica (DICOM -> plataforma)
        run: node tests/exames.js

      - name: Teste da personalização do laudo (layout)
        run: node tests/layout.js

      - name: Teste da mentoria
        run: node tests/mentoria.js

      - name: Teste da revisão do mentor
        run: node tests/revisao-mentor.js

      - name: Teste de anotações manuais e clínicas de teste
        run: node tests/anotacoes.js

      - name: Teste do envio por pendrive (pasta sintética)
        run: node tests/pendrive.js

      - name: Teste da API de ingestão (apps e receptor)
        run: node tests/ingestao.js

      - name: Ataque automático leve (OWASP ZAP baseline)
        run: |
          mkdir -p zap && chmod 777 zap
          # -I: avisos ficam no relatório; só falha nas regras marcadas como FAIL
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:5080 -I -r zap-relatorio.html -J zap-relatorio.json

      - name: Testes de segurança do acesso (por último; esgota o limite de logins)
        run: node tests/seguranca.js

      - name: Relatório do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-relatorio
          path: zap/
          if-no-files-found: ignore

      - name: Logs dos containers
        if: always()
        run: docker compose logs --no-color

      - name: Remover o Mailpit
        if: always()
        run: docker rm -f vetus-mailpit || true

      - name: Derrubar compose
        if: always()
        run: docker compose down -v

  # 5) Publicação da plataforma em ghcr.io: só manual (Actions -> Validar containers -> Run workflow -> publicar),
  #    e só depois de lint, segredos/dependências, CodeQL e todos os testes de ponta a ponta passarem.
  #    A VPS só baixa esta imagem (docker compose pull); nunca constrói nada. Ver docs/PRODUCAO.md.
  publicar:
    name: Publicar imagem da plataforma (manual)
    needs: [lint, seguranca-codigo, codeql, containers]
    if: github.event_name == 'workflow_dispatch' && inputs.publicar && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Versão (plataforma/front/package.json)
        id: versao
        run: echo "v=$(node -p "require('./plataforma/front/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e envio (latest + versão + commit)
        uses: docker/build-push-action@v6
        with:
          context: ./plataforma
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGEM_PLATAFORMA }}:latest
            ${{ env.IMAGEM_PLATAFORMA }}:${{ steps.versao.outputs.v }}
            ${{ env.IMAGEM_PLATAFORMA }}:${{ github.sha }}
