name: Validar containers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  containers:
    name: Build e teste ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_USER: ci
      ADMIN_PASSWORD: ci-senha-teste
      DICOM_PORT: "2345"
      WEB_PORT: "8080"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            receptor/package-lock.json
            web/package-lock.json

      - name: Verificar sintaxe
        run: |
          for f in receptor/src/*.js web/src/*.js tests/*.js; do node --check "$f"; done

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Build das imagens
        run: docker compose build

      - name: Subir containers
        run: docker compose up -d

      - name: Aguardar containers saudáveis
        run: |
          for i in $(seq 1 60); do
            r=$(docker inspect -f '{{.State.Health.Status}}' vetus-receptor)
            w=$(docker inspect -f '{{.State.Health.Status}}' vetus-web)
            echo "receptor=$r web=$w"
            [ "$r" = healthy ] && [ "$w" = healthy ] && exit 0
            sleep 2
          done
          exit 1

      - name: Dependências do teste
        run: npm ci --prefix receptor

      - name: Teste ponta a ponta (envio DICOM -> fotos -> área web)
        run: node tests/e2e.js

      - name: Logs dos containers
        if: always()
        run: docker compose logs --no-color

      - name: Derrubar containers
        if: always()
        run: docker compose down -v
